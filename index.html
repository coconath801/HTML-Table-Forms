<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML Table and Form</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Basic HTML Table</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Mark</td>
            <td>22</td>
        </tr>
    </table>

    <h2>Basic HTML Form</h2>
    <form>
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
